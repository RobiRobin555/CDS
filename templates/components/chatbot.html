<!-- Chatbot Widget Component -->
<link rel="stylesheet" href="/static/css/chatbot.css">

<!-- Chatbot Button -->
<button class="chatbot-button" id="chatbotButton" onclick="toggleChatbot()">
    🤖
    <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
</button>

<!-- Chatbot Window -->
<div class="chatbot-window" id="chatbotWindow">
    <!-- Header -->
    <div class="chatbot-header">
        <div class="chatbot-header-content">
            <div class="chatbot-avatar">🤖</div>
            <div class="chatbot-info">
                <h3>AI Assistant</h3>
                <div class="chatbot-status">
                    <span class="status-dot"></span>Online
                </div>
            </div>
        </div>
        <button class="close-chatbot" onclick="toggleChatbot()">✕</button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            <div class="message-avatar">🤖</div>
            <div class="message-content">
                <div class="message-bubble">
                    Xin chào! 👋 Tôi là AI Assistant của SmartSchedule. Tôi có thể giúp bạn quản lý lịch học và nhiệm vụ. Bạn cần giúp gì?
                </div>
                <div class="message-time" id="initialMessageTime"></div>
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
        <div class="quick-actions-title">Gợi ý câu hỏi:</div>
        <div class="quick-action-buttons">
            <button class="quick-action-btn" onclick="sendQuickMessage('Hôm nay tôi có lịch gì?')">
                📅 Lịch hôm nay
            </button>
            <button class="quick-action-btn" onclick="sendQuickMessage('Tuần này tôi học mấy tiết?')">
                📊 Thống kê tuần
            </button>
            <button class="quick-action-btn" onclick="sendQuickMessage('Deadline nào sắp tới?')">
                ⚠️ Deadline
            </button>
        </div>
        <div class="quick-actions-title" style="margin-top: 8px;">Theo môn sắp học:</div>
        <div class="quick-action-buttons" id="dynamicSuggestions"></div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
        <div class="input-container">
            <textarea 
                class="chat-input" 
                id="chatInput" 
                placeholder="Nhập tin nhắn..." 
                rows="1"
            ></textarea>
            <button class="send-button" id="sendButton" onclick="sendMessage()">
                ➤
            </button>
        </div>
    </div>
</div>

<script src="/static/js/chatbot.js"></script>

<script>
    // Set initial message time
    document.addEventListener('DOMContentLoaded', function() {
        const timeEl = document.getElementById('initialMessageTime');
        if(timeEl) {
            const now = new Date();
            timeEl.textContent = now.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'});
        }
    });
</script>
