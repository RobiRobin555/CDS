{% extends 'base.html' %}

{% block title %}Nghiên cứu{% endblock %}

{% block extra_css %}
<style>
    /* Layout chính kiểu Claude */
    .research-layout {
        display: flex;
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }
    
    /* Sidebar lịch sử */
    .research-sidebar {
        width: 300px;
        flex-shrink: 0;
        background-color: var(--card-bg);
        border-radius: 10px;
        box-shadow: var(--card-shadow);
        padding: 15px;
        max-height: calc(100vh - 150px);
        position: sticky;
        top: 80px;
        overflow-y: auto;
    }
    
    .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-color);
    }
    
    .sidebar-content {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .btn-small {
        padding: 4px 8px;
        font-size: 0.8rem;
    }
    
    .btn-danger {
        background-color: #dc3545;
        color: white;
    }
    
    .btn-danger:hover {
        background-color: #c82333;
    }
    
    /* Container chính (cột giữa kiểu Claude) */
    .research-container {
        flex-grow: 1;
        max-width: 820px;
    }
    
    /* Responsive layout */
    @media (max-width: 992px) {
        .research-layout {
            flex-direction: column;
        }
        
        .research-sidebar {
            width: 100%;
            max-height: 300px;
            position: relative;
            top: 0;
        }
        
        .research-container {
            max-width: 100%;
        }
    }
    
    .research-header {
        margin-bottom: 30px;
        text-align: center;
    }
    
    .research-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 24px;
        background-color: var(--card-bg);
        padding: 16px;
        border-radius: 16px;
        box-shadow: var(--card-shadow);
    }
    
    .subject-selection {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .subject-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
    }
    
    .subject-card {
        padding: 12px 14px;
        border-radius: 20px;
        background-color: var(--bg-secondary);
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid var(--border-color);
    }
    .subject-card.active {
        background-color: #f0f7ff;
        border-color: #96c5ff;
    }

    /* Bố cục giống Claude: vùng nhập + kết quả dạng chat */
    .composer {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 12px;
        box-shadow: var(--card-shadow);
        position: sticky;
        bottom: 0;
        margin-top: auto;
    }
    
    .composer-textarea-container {
        display: flex;
        width: 100%;
    }
    
    .composer textarea {
        flex: 1;
        min-height: 80px;
        max-height: 200px;
        resize: vertical;
        border: 2px solid var(--border-color);
        outline: none;
        background: var(--input-bg);
        color: var(--text-color);
        border-radius: 12px;
        padding: 12px;
        font-size: 1rem;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        transition: border-color 0.3s ease;
    }
    
    .composer-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
    }
    
    .composer-actions-buttons {
        display: flex;
        gap: 10px;
    }
    
    .web-search-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .toggle-switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 24px;
    }
    
    .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }
    
    .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: .4s;
        border-radius: 24px;
    }
    
    .toggle-slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }
    
    input:checked + .toggle-slider {
        background-color: #2a7cff;
    }
    
    input:checked + .toggle-slider:before {
        transform: translateX(26px);
    }
    .btn-outline {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-color);
    }
    .btn-outline.active {
        border-color: #2a7cff;
        color: #2a7cff;
        background: #eef5ff;
    }
    .btn-primary {
        background: #2a7cff;
        color: white;
        border: 1px solid #2a7cff;
    }
    .btn-primary:hover {
        background: #1f6bdd;
        border-color: #1f6bdd;
    }
    .chat-stream {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 30px;
        height: calc(100vh - 250px);
        overflow-y: auto;
        padding: 10px;
    }
    
    .msg {
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 18px;
        background: var(--card-bg);
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        max-width: 90%;
        position: relative;
        animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .msg.assistant { 
        background: #f8fafc; 
        border-left: 4px solid #2a7cff;
        margin-right: auto;
    }
    
    .msg.user { 
        background: #f0f7ff; 
        border-right: 4px solid #6c757d;
        margin-left: auto;
        text-align: right;
    }
    
    .msg-content {
        line-height: 1.6;
    }
    
    .msg-time {
        font-size: 0.75rem;
        color: #6c757d;
        margin-top: 8px;
        display: block;
    }
    
    .subject-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--card-shadow);
    }
    
    .subject-card.selected {
        border-color: var(--primary-color);
        background-color: var(--primary-light);
    }
    
    .query-input {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .query-input textarea {
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background-color: var(--input-bg);
        color: var(--text-color);
        min-height: 100px;
        resize: vertical;
    }
    
    .query-suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
    }
    
    .suggestion-chip {
        padding: 6px 12px;
        border-radius: 20px;
        background-color: var(--bg-secondary);
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.2s;
    }
    
    .suggestion-chip:hover {
        background-color: var(--primary-light);
    }
    
    .research-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }
    
    .research-result {
        background-color: var(--card-bg);
        padding: 20px;
        border-radius: 10px;
        box-shadow: var(--card-shadow);
        margin-top: 20px;
        min-height: 200px;
    }
    
    .result-content {
        white-space: pre-wrap;
        line-height: 1.6;
    }
    
    .result-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
    }
    
    /* Nút tiếp tục nghiên cứu */
    .continue-research-container {
        display: flex;
        justify-content: center;
        margin-top: 20px;
        margin-bottom: 30px;
    }
    
    #continueResearchBtn {
        padding: 10px 20px;
        font-size: 1rem;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
    }
    
    #continueResearchBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .history-item:hover {
        transform: translateY(-2px);
        box-shadow: var(--card-shadow);
    }
    
    .history-subject {
        font-weight: bold;
        color: var(--primary-color);
        margin-right: 25px;
    }
    
    .history-query {
        margin: 8px 0;
        font-style: italic;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
    }
    
    .history-date {
        font-size: 0.8rem;
        color: var(--text-secondary);
    }
    
    .history-delete {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: rgba(220, 53, 69, 0.1);
        color: #dc3545;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.2s;
    }
    
    .history-item:hover .history-delete {
        opacity: 1;
    }
    
    .history-delete:hover {
        background-color: rgba(220, 53, 69, 0.2);
    }
    
    /* Responsive */
    @media (max-width: 900px) {
        .research-layout {
            flex-direction: column-reverse;
        }
        
        .research-sidebar {
            width: 100%;
            max-height: none;
            position: static;
        }
        
        .subject-list {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }
        
        .research-actions {
            flex-direction: column;
        }
        
        .research-actions button {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="research-layout">
    <!-- Sidebar lịch sử nghiên cứu -->
    <div class="research-sidebar">
        <div class="sidebar-header">
            <h3>Lịch sử nghiên cứu</h3>
            <button class="btn btn-small btn-danger" id="clearHistoryBtn">Xóa tất cả</button>
        </div>
        <div id="researchHistory" class="sidebar-content"></div>
    </div>
    
    <!-- Nội dung chính -->
    <div class="research-container">
        <div class="research-header">
            <h1>AI Nghiên cứu</h1>
            <p>Đặt câu hỏi tự do và nhận câu trả lời tự nhiên từ AI</p>
        </div>
        
        <div class="research-form">
            <!-- Khu vực chat -->
            <div id="chatStream" class="chat-stream"></div>
            
            <!-- Nút tiếp tục nghiên cứu -->
            <div id="continueResearchContainer" class="continue-research-container" style="display: none;">
                <button id="continueResearchBtn" class="btn btn-primary">
                    <i class="fas fa-arrow-right"></i>
                    Tiếp tục nghiên cứu
                </button>
            </div>
            
            <!-- Composer -->
            <div class="composer">
                <div class="composer-textarea-container">
                    <textarea id="queryInput" class="composer-textarea" placeholder="Nhập câu hỏi nghiên cứu của bạn..."></textarea>
                </div>
                <div class="composer-actions">
                    <div class="web-search-toggle">
                        <label class="toggle-switch">
                            <input type="checkbox" id="webSearchToggle">
                            <span class="toggle-slider"></span>
                        </label>
                        <span>Tìm kiếm web</span>
                    </div>
                    <div class="composer-actions-buttons">
                        <button id="resetFormBtn" class="btn btn-outline">
                            <i class="fas fa-redo-alt"></i>
                            Làm mới
                        </button>
                        <button id="startResearchBtn" class="btn btn-primary">
                            <i class="fas fa-search"></i>
                            Nghiên cứu
                        </button>
                    </div>
                </div>
            </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/research.js') }}"></script>
{% endblock %}
